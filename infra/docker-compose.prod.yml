version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: agentflow
      POSTGRES_USER: agentflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentflow"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENV: production
      DATABASE_URL: postgresql+psycopg://agentflow:${POSTGRES_PASSWORD:-changeme}@postgres:5432/agentflow
      REDIS_URL: redis://redis:6379/0
      API_KEY: ${API_KEY}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://your-frontend.vercel.app}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      ESCALATION_CONTINUE_MAX: ${ESCALATION_CONTINUE_MAX:-0.35}
      ESCALATION_APPROVE_MAX: ${ESCALATION_APPROVE_MAX:-0.70}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
